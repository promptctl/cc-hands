[project]
name = "hands"
dynamic = ["version"]
description = "Hands-free control of Claude Code: a voice intermediary in one daemon"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[local,pocket-tts]>=1.9.0,<2",
    "mlx-whisper>=0.4.3,<0.5",  # hands.voice.transcription calls it, and its tokenizer, directly
    "aiohttp>=3.11",  # ClientConnectorDNSError
    "loguru>=0.7",
    "pyobjc-framework-cocoa>=11",
    "pyobjc-framework-coreaudio>=11",
    "pyobjc-framework-quartz>=12.2.2",
    "brotli>=1.2.0",
    "zstandard>=0.25.0",
    "docstring-parser>=0.18.0",
    "aiortc>=1.14,<2",
    "ifaddr>=0.2",
    "segno>=1.6",
    "livekit>=1.1.20,<2",
    "openwakeword>=0.6,<0.7",
    "tomlkit>=0.15.1",  # hands.daemon.config sets the model chosen by voice in config.toml, every other line kept
    "mlx-audio==0.6.2",  # hands.voice.streaming runs Nemotron Speech Streaming paired with Nemotron 3 Diarization in its speaker streaming session, and closes each speaker's stream at a hold's end through the session's own state, which no release promises; hands.voice.engaged judges each stop with its Smart Turn port's predict_endpoint, whose settings and verdicts hands measured: so the version is pinned
    "sherpa-onnx>=2.0.1,<3",  # hands.voice.voiceprints runs ERes2Net speaker embeddings with its SpeakerEmbeddingExtractor, on the CPU
    "soxr>=1.0,<2",  # hands.voice.voices resamples the TTS output its own voiceprint is made from
]

[project.scripts]
hands = "hands.daemon.cli:entry"
# What the plugin's hooks and its attention skill run (plugin/): a console script's shebang is the interpreter hands was installed
# with, so the plugin needs no launcher rendered for it.
hands-shim = "hands.sessions.shim:entry"
hands-attention = "hands.sessions.attention:entry"

[dependency-groups]
# [LAW:locality-or-seam] exception: tests/timeouts.py reads the suite's settings through pytest-timeout's
# `get_env_settings`, outside its `__all__`, and wraps the SIGALRM handler it installs and the `pytest.fail.Exception` that
# raises, so a major version that moves either is taken on purpose. It also writes past the capture through pytest's
# `CaptureManager.global_and_fixture_disabled`, not public API, which uv.lock pins and the suite fails on a move of.
dev = ["nltk>=3.10", "pyright>=1.1", "pytest>=8", "pytest-asyncio>=0.24", "pytest-reportlog>=1", "pytest-timeout>=2.3,<3", "soundfile>=0.13"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# [LAW:one-source-of-truth] the version is the release's tag, vX.Y.Z; a commit past the last tag reads as a dev version.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/hands"]

# hatch_build.py: the package carries fritter, built for macOS arm64, in a wheel and in a checkout's editable install.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportMatchNotExhaustive = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pytester, for the tests of conftest's own hooks (tests/test_ci_skips.py): pytest_plugins is read only from the
# rootdir's conftest.
# --durations: the slowest setups and calls of every run, CI's among them, beside the timeout below, so how close a test
# runs to it is seen before it is crossed.
# --report-log: what every test cost, tests/costs.py's to read, line by line as each phase ends, so a run CI cancels keeps
# what it finished; a report written at the session's end would be lost, as the runner's cancel never reaches pytest.
addopts = ["-p", "pytester", "--durations=20", "--report-log=.pytest_cache/report-log.jsonl", "--report-log-exclude-logs-on-passed-tests"]
# quarantined: a flaky test that still runs and reports, and whose failure cannot fail the run; tests/quarantine_gate.py fails
# CI once its ticket's quarantine is older than its week.
markers = ["quarantined(ticket): a flaky test that runs and reports, and cannot fail the run until its week ends"]
# [LAW:single-enforcer] the one owner of "no test hangs": one that never finishes fails here, named, with the stack it
# was stuck in. A wait inside a test (conftest's `patiently`) is for failing fast on a stall, and leans on this to end
# a run that keeps moving for ever, or holds the loop for ever. The slowest test takes 14 s on a quiet machine, and
# load slows it 3 to 5 times.
timeout = 120
# A signal raised in the stuck test, which also stops a match `re` holds the GIL for: the thread method ends the whole
# run on one, and tests/test_steps.py's linear-time gate leans on this.
timeout_method = "signal"

[tool.uv]
# hands is a Mac app (CoreAudio, Quartz event taps), so the lock is resolved for macOS alone: openWakeWord's Linux-only
# tflite-runtime has no wheel for the Python hands runs on.
environments = ["sys_platform == 'darwin'"]
# A new commit or tag rebuilds the checkout's own install, so `hands --version` there is the checkout's, and so does an
# edit to fritter's source or its build, so the fritter in src/hands/bin is the checkout's.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "fritter/go.mod" }, { file = "fritter/go.sum" }, { file = "fritter/**/*.go" }, { git = { commit = true, tags = true } }]
