<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>hands</title>
<style>
  :root {
    --bg: #f4f2ee; --fg: #1d1c1a; --muted: #6b6862; --ring: #d9d5cd;
    --idle: #2f2d2a; --live: #c2410c; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --fg: #eeebe6; --muted: #9a958d; --ring: #2c2a27; --idle: #e9e5de; --live: #f97316; --bad: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  /* The body grows past the screen with the brain's calls listed, so the top of it is never centred out of reach. */
  html { height: 100%; }
  body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #talk {
    width: min(68vw, 300px); aspect-ratio: 1; border-radius: 50%;
    border: 10px solid var(--ring); background: var(--idle); color: var(--bg);
    font: inherit; font-weight: 600; font-size: 22px; line-height: 1.2; letter-spacing: .02em;
    touch-action: none; cursor: pointer; transition: transform .08s, background .08s;
  }
  #talk:disabled { opacity: .35; cursor: default; }
  #talk.held { background: var(--live); transform: scale(.96); }
  #told { color: var(--muted); text-align: center; max-width: 30ch; }
  #told p { margin: 0; min-height: 1.4em; }
  #state.bad, #wake-note.bad { color: var(--bad); }
  #count { font-variant-numeric: tabular-nums; }
  /* One small toggle in the corner: the dot is filled while the wake word is on. */
  #wake {
    position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 12px; display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--ring); border-radius: 999px;
    padding: 4px 10px; cursor: pointer;
  }
  #wake .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
  #wake[aria-pressed="true"] .dot { background: var(--live); border-color: var(--live); }
  #wake-note:empty { display: none; }
  #shown { font: inherit; color: var(--muted); background: none; border: 1px solid var(--ring); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  #conversation { color: var(--muted); }
  #transcript {
    width: min(100%, 36rem); max-height: 38vh; overflow-y: auto; margin: 0; padding: 0 4px;
    user-select: text; -webkit-user-select: text;
  }
  #transcript p { margin: 0 0 10px; }
  #transcript:empty::before { content: "Nothing said yet."; color: var(--muted); }
  #transcript .user { color: var(--muted); text-align: right; }
  /* hands' words not yet reached are faint; the one being said is marked; those cut off are struck through. */
  #transcript .ahead { opacity: .45; }
  #transcript .now { background: var(--ring); border-radius: 3px; }
  #transcript .unheard { opacity: .45; text-decoration: line-through; }
  #brain { width: min(100%, 36rem); border-top: 1px solid var(--ring); padding-top: 10px; }
  #brain-head { display: flex; align-items: center; justify-content: space-between; column-gap: 12px; }
  #doing { margin: 0; font-weight: 600; }
  #doing .for { color: var(--muted); font-weight: 400; }
  #calls { list-style: none; margin: 4px 0 0; padding: 0; }
  #calls li { margin: 6px 0 0; }
  #calls .tool { font-size: 15px; font-weight: 600; margin: 0; }
  /* An input runs as long as the call made it: three lines of it, so the Stop never scrolls away. */
  #calls .input { margin: 0; color: var(--muted); font: 13px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  #calls .input.bad, #brain-said.bad { color: var(--bad); }
  #stop { font: inherit; font-weight: 600; font-size: 16px; line-height: 1; color: var(--bg); background: var(--bad); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  #stop:disabled { opacity: .45; cursor: default; }
  #brain-said { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
  #brain-said:empty { display: none; }
</style>
</head>
<body>
<!-- Whether the wake word may open a turn: on unless the user turned it off, before Connect or after. -->
<button id="wake" type="button" aria-pressed="true"><span class="dot" aria-hidden="true"></span>Phone wake word</button>
<button id="talk" type="button">Connect</button>
<!-- The count changes ten times a second, so it sits outside the live region: a screen reader says each line once. -->
<div id="told">
  <p id="state" role="status" aria-live="polite"></p>
  <p id="wake-note" role="status" aria-live="polite"></p>
  <p id="count" aria-hidden="true"></p>
</div>
<button id="shown" type="button" aria-controls="transcript" aria-expanded="false">Show transcript</button>
<!-- The whole conversation, tools and all, with a box to type in: the address carries the key on as this one does. A
     page of its own, so a call on this one goes on while it is read. -->
<a id="conversation" href="/conversation" target="_blank" rel="noopener">Conversation</a>
<!-- The voices hands speaks in, each heard and chosen, and hands' own options, on a page of its own under the same key. -->
<a id="gallery" href="/gallery" target="_blank" rel="noopener">Voices and options</a>
<!-- Every line is written here whether it is shown or not: showing it is only taking the hidden off. -->
<section id="transcript" aria-label="Transcript" hidden></section>
<!-- What the brain is doing now, as hands hears it on the wire: idle, thinking, or the calls it is running, each with
     its input, and how long; and one Stop that ends the brain's turn, as Escape at its keyboard does. Nothing here
     reaches a working session. -->
<section id="brain" aria-label="The brain">
  <div id="brain-head"><p id="doing" role="status" aria-live="polite"></p><button id="stop" type="button" disabled>Stop</button></div>
  <ul id="calls"></ul>
  <p id="brain-said" role="status" aria-live="polite"></p>
</section>
<audio id="out" autoplay playsinline></audio>
<script type="module">
import {asked, carriesKey, handsNow, reading, unanswered} from "/hands.js";

// This page's own name, made as it opened: a call it makes again after a drop is one hands knows for this page's.
const PAGE = crypto.randomUUID();
// hands sends its voice every 20 ms, silence and all, for as long as the call is up: a call it has sent nothing over
// for this long is gone, as hands takes a page gone that sends nothing for its QUIET_SECS.
const QUIET_MS = 3000;
// The waits between calls made again, doubling from the first to the last, which repeats while hands stays out of reach.
const FIRST_RETRY_MS = 1000, LAST_RETRY_MS = 8000;
// hands answers an offer within a second or two: one unanswered for this long went to an address the phone can no longer
// reach, as when it moves off the LAN, and is a call dropped like any other.
const OFFER_MS = 10000;
const talk = document.getElementById("talk");
const state = document.getElementById("state");
const wakeButton = document.getElementById("wake");
const wakeNote = document.getElementById("wake-note");
const count = document.getElementById("count");
const out = document.getElementById("out");
const shown = document.getElementById("shown");
const transcript = document.getElementById("transcript");
const doing = document.getElementById("doing");
const calls = document.getElementById("calls");
const stopButton = document.getElementById("stop");
const brainSaid = document.getElementById("brain-said");
// hands answers a Stop at once: one unanswered for this long went to an address the phone can no longer reach. What a
// Stop said is said of that tap alone, so it is shown for a while and then taken away: the line above says how the brain
// stands from then on.
const STOP_MS = 10000, SAID_MS = 30000;
document.getElementById("conversation").href = `/conversation${location.hash}`;
document.getElementById("gallery").href = `/gallery${location.hash}`;

// Every render quantum of the microphone goes to the page as it is captured; whatever is sent in comes back out after
// every block captured before it, which is how a release is sent only once the words said before it have been.
const TAP = `
registerProcessor("tap", class extends AudioWorkletProcessor {
  constructor() { super(); this.port.onmessage = ({data}) => this.port.postMessage(data); }
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
});`;

// The microphone, opened at the first Connect pressed and kept across every call made again after it, which no press
// starts: a browser opens the microphone for a press, not for a page calling on its own.
let media = null;  // {stream, audio, tap}
let call = null;  // {pc, channel, ended, presses, press, release}
let held = false;
// Whether the page means to be on a call: from its first call's opening after Connect is pressed until hands gives the
// phone to another page, the page cannot call at all, or it goes. While it does, a call that drops is made again; a
// press whose call never opens is said, for the user there to press again.
let wanted = false;
let retry = null, tries = 0;
// Each call's own number for what it sends through the tap to come back, so what a dropped call sent is never taken
// for the next call's.
let tags = 0;

// Whether the line is the one that says how the call stands between turns: it is said again as that changes, and no other is.
let idle = false;

function say(text, bad = false) { state.textContent = text; state.classList.toggle("bad", bad); idle = false; }

// Whether the wake word may open a turn: the user's choice, kept in the browser, and on until they turn it off.
let wakeOn = true;
try { wakeOn = localStorage.getItem("wake word") !== "off"; } catch { /* on, for this page only */ }

// The phrase the Mac's detector listens for, as the detector of the call said it; null until it has.
let phrase = null;

// What the page says of the clip it shows, by the last milestone of it. Three milestones are the page's own: `held`, the button
// down, `woken`, the detector hearing the word, and `sent`, the button let go with hands yet to say it took the clip. A
// milestone that `counts` is waited on: the time since the button was let go counts beside its line.
const NOTHING = "Heard nothing from that press.";
const nothingAfter = () => `Heard nothing after "${phrase}".`;
const OWN = {
  "held": {text: () => "Listening…"},
  "woken": {text: () => "Listening…"},
  "sent": {text: () => "Sent. Waiting for hands…", counts: true},
  // Not told as a milestone: entered on hands' `unopened` for the press, which opened no clip, so nothing is coming to wait for.
  "unopened": {text: (clip) => clip.wake ? nothingAfter() : NOTHING, bad: true},
  // Entered on hands' `unopened` for a wake made while hands was at the desk, which it opens no clip at: only the button brings it.
  "desk": {text: () => "hands is at the desk. Hold the button to bring it here.", bad: true},
};
// The milestones hands tells (hands.voice.milestone), each naming the milestones it may come after. The release names the
// clip it took, so the page takes only its own press's: let go, or still held as a hand at the desk took hands there and
// sent it, which the page says, since hands hears the desk from then on. The milestones after it are of the turn and carry no clip, so what places them is where they fall: one that
// cannot come after the shown clip's last is of a clip the page has let go of, and until hands says it took this clip,
// nothing else told is of it.
const TOLD = {
  "released": {after: ["held", "woken", "sent"], text: () => held ? "Sent: hands went to the desk, and hears you there now." : "Received. Transcribing…", counts: true},
  // The clip was thrown away, so nothing of it was sent: it ends as a release ends it, and no reply is coming.
  "discarded": {after: ["held", "woken", "sent"], text: (clip) => clip.wake ? nothingAfter() : NOTHING, bad: true},
  "transcript": {after: ["released"], text: () => "Heard. Waiting for a reply…", counts: true},
  "no words": {after: ["released"], text: (clip) => `No words heard, after ${secs(clip.at - clip.released)}.`, bad: true},
  "failed": {after: ["released", "transcript", "first LLM token"], text: (clip) => `hands failed, after ${secs(clip.at - clip.released)}.`, bad: true},
  "first LLM token": {after: ["released", "transcript"], text: () => "Replying…", counts: true},
  // The first sound after the button was let go, whatever hands said with it.
  "first audio": {after: ["released", "transcript", "first LLM token"], text: (clip) => `hands spoke after ${secs(clip.at - clip.released)}${clip.heard === null ? "" : `, your words heard at ${secs(clip.heard - clip.released)}`}.`},
};
// The clip shown: the call's number for its press, hands' number for it, its last milestone and when that came, when it was released, and when its words
// were heard.
let clip = null;
// The one timer the count runs on, while the clip shown is waited on.
let ticking = null;

function secs(ms) { return `${(ms / 1000).toFixed(1)} s`; }

function tick() { count.textContent = secs(performance.now() - clip.released); }

// Shows `next` as the clip: its line said once, and its count running while it is waited on.
function show(next) {
  letGo();
  clip = next;
  const line = OWN[clip.milestone] ?? TOLD[clip.milestone];
  say(line.text(clip), line.bad);
  if (line.counts) { ticking = setInterval(tick, 100); tick(); }
}

// Every time is the page's own, from the button let go to the milestone arriving: the wait as it is felt at the phone.
function milestone(name, number) {
  // [LAW:no-silent-failure] the page and hands disagree about what hands tells: said on its face, not guessed at.
  if (!Object.hasOwn(TOLD, name)) { letGo(); say(`hands said "${name}", which this page does not know.`, true); return; }
  if (clip === null || !TOLD[name].after.includes(clip.milestone)) return;
  // A milestone that names its clip is of that clip alone.
  if (number !== undefined && number !== clip.number) return;
  const at = performance.now();
  // A clip hands took while its button was down was released then, not when the button comes up.
  show({...clip, milestone: name, at, released: clip.released ?? at, heard: name === "transcript" ? at : clip.heard});
}

// The clip a press of the page's opened, by the press's number: hands bound the two as the press opened it, so however late
// either arrives, it is the shown press's own or none of it.
function opened(message) {
  if (clip?.press !== message.press) return;
  clip = {...clip, number: message.clip};
}

// hands' word that a press of the page's opened no clip, by the press's number: the shown press's own or none of it.
function unopened(message) {
  if (clip?.press !== message.press) return;
  show({...clip, milestone: message.at_desk ? "desk" : "unopened", at: performance.now()});
}

// Lets go of the clip shown: no milestone told from here is of it, and its count stops.
function letGo() { clearInterval(ticking); ticking = null; clip = null; count.textContent = ""; }

// The sentence of hands' playing: its words, where each ends in its text, when it started, and the rate hands speaks
// at, in characters a millisecond; null between sentences.
let saying = null;  // {words, ends, started, rate, frame}

// Writes a line at the transcript's end, keeping its end in view if it was.
function write(line) {
  const atEnd = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 24;
  transcript.append(line);
  if (atEnd) transcript.scrollTop = transcript.scrollHeight;
}

// [LAW:one-source-of-truth] pocket-tts gives no word timings, so a word is reached when as many characters of its
// sentence have been said, at the rate hands measured, as come before it; the last waits there until hands says it is
// done.
function sweep() {
  const reached = (performance.now() - saying.started) * saying.rate;
  const now = Math.min(saying.ends.filter((end) => end <= reached).length, saying.words.length - 1);
  saying.words.forEach((word, i) => { word.className = i < now ? "" : i === now ? "now" : "ahead"; });
  saying.frame = requestAnimationFrame(sweep);
}

// Ends the sentence playing, each word as `left` would have it: said, or cut off.
function stop(left) {
  if (saying === null) return;
  cancelAnimationFrame(saying.frame);
  saying.words.forEach((word) => { word.className = left(word); });
  saying = null;
}

// What of a sentence stopped short was not heard: the words not yet reached.
const bargedIn = (word) => word.className === "ahead" ? "unheard" : "";

// What each line of the transcript does to the page (hands.voice.transcript).
const LINES = {
  "heard": ({text}) => {
    const line = document.createElement("p");
    line.className = "user";
    line.textContent = text;
    write(line);
  },
  "saying": ({text, chars_per_sec}) => {
    stop(() => "");
    const line = document.createElement("p");
    let end = 0;
    const words = [], ends = [];
    for (const part of text.split(/(\s+)/)) {
      if (part === "") continue;
      if (/^\s+$/.test(part)) { line.append(part); end += part.length; continue; }
      const word = document.createElement("span");
      word.textContent = part;
      line.append(word);
      words.push(word); end += part.length; ends.push(end);
    }
    write(line);
    saying = {words, ends, started: performance.now(), rate: chars_per_sec / 1000, frame: null};
    sweep();
  },
  "spoken": () => stop(() => ""),
  "bargein": () => stop(bargedIn),
};

// [LAW:single-enforcer] the wake's turn is open until hands says it is over, and the page never guesses: its press `unopened`, or
// its clip `released` or `discarded`. Nothing else closes it, and a turn the button took over has no word of the wake's to wait on.
function turnTold(made, message) {
  const turn = made.turn;
  if (turn.kind !== "wake") return;
  switch (message.kind) {
    case "opened":
      if (message.press === turn.press) turn.clip = message.clip;
      return;
    case "unopened":
      if (message.press === turn.press) made.close();
      return;
    case "milestone":
      if ((message.milestone === "released" || message.milestone === "discarded") && turn.clip !== null && message.clip === turn.clip) made.close();
      return;
  }
}

// Everything hands tells the page over `made`'s channel, by its kind: a clip opened, a milestone of the clip shown, or a line
// of the transcript.
function told(made, message) {
  turnTold(made, message);
  if (message.kind === "milestone") { milestone(message.milestone, message.clip); return; }
  if (message.kind === "opened") { opened(message); return; }
  if (message.kind === "unopened") { unopened(message); return; }
  // [LAW:no-silent-failure] the page and hands disagree about what hands tells: said on its face, not guessed at.
  if (!Object.hasOwn(LINES, message.kind)) { say(`hands told a "${message.kind}", which this page does not know.`, true); return; }
  LINES[message.kind](message);
}

function pcm(blocks) {
  const length = blocks.reduce((n, b) => n + b.length, 0);
  const samples = new Int16Array(length);
  let i = 0;
  for (const block of blocks) for (const s of block) samples[i++] = Math.max(-32768, Math.min(32767, Math.round(s * 32767)));
  return samples.buffer;
}

// The last `length` samples of the microphone made while no turn was open, in the blocks the tap gave them.
class Ring {
  constructor(length) { this.length = length; this.blocks = []; this.held = 0; }
  push(block) {
    this.blocks.push(block); this.held += block.length;
    for (let over = this.held - this.length; over > 0; over = this.held - this.length) {
      const oldest = this.blocks[0];
      if (oldest.length <= over) { this.blocks.shift(); this.held -= oldest.length; }
      else { this.blocks[0] = oldest.subarray(over); this.held -= over; }
    }
  }
  // What it holds, in order, and nothing after.
  empty() { const blocks = this.blocks; this.blocks = []; this.held = 0; return blocks; }
}

// `blocks` as messages of audio of `per` samples each, the last what is left.
function cut(blocks, per) {
  const all = new Float32Array(blocks.reduce((n, b) => n + b.length, 0));
  let at = 0;
  for (const block of blocks) { all.set(block, at); at += block.length; }
  const messages = [];
  for (let from = 0; from < all.length; from += per) messages.push(pcm([all.subarray(from, from + per)]));
  return messages;
}

// The browser the page is in, as it says it: what tells an iPhone's Safari from a desktop's Chrome in hands' events.
const BROWSER = navigator.userAgent;

// The line that says how the call stands between turns: said again as that changes, and no other line is.
function sayIdle() {
  say(call?.listening?.ready ? `Connected. Say "${phrase}", or hold the button.` : "Connected. Hold the button and speak.");
  idle = true;
}

// The wake word's own state, which no turn's line says: why it is not listening, or that hands has not answered it, and why the
// screen may go to sleep.
let lockWhy = null;
function drawNote() {
  const listening = call?.listening;
  const notes = [];
  if (listening?.why) notes.push(`The wake word is not listening: ${listening.why}.`);
  else if (listening?.waiting) notes.push(`The wake word is waiting on hands: ${listening.waiting}.`);
  if (lockWhy !== null) notes.push(`The screen may go to sleep, which stops the wake word: ${lockWhy}.`);
  wakeNote.textContent = notes.join(" ");
  wakeNote.classList.toggle("bad", listening?.why != null);
}

function refresh() {
  if (idle) sayIdle();
  drawNote();
}

// The screen stays on while the wake word is on and the call is up, which a browser ends when the page leaves the front: the
// lock is asked for again as it comes back. One change at a time, so a lock asked for as it is no longer wanted is let go.
let lock = null;
let locking = Promise.resolve();
function syncLock() {
  locking = locking.then(async () => {
    const wanted = wakeOn && call?.channel.readyState === "open" && !document.hidden;
    try {
      if (wanted && lock === null) {
        const got = await navigator.wakeLock.request("screen");
        got.addEventListener("release", () => { if (lock === got) lock = null; });
        lock = got;
        lockWhy = null;
      } else if (!wanted) {
        lockWhy = null;
        if (lock !== null) {
          const held = lock;
          lock = null;
          await held.release();
        }
      }
    } catch (error) {
      lockWhy = error.message;
    }
    drawNote();
  });
}

function drawWake() { wakeButton.setAttribute("aria-pressed", String(wakeOn)); }

// The user's choice, kept, and acted on at once by a call that is up: before Connect it changes nothing but what the next call does.
function setWake(on) {
  wakeOn = on;
  try { localStorage.setItem("wake word", on ? "on" : "off"); } catch { /* kept for this page only */ }
  drawWake();
  if (call?.channel.readyState === "open") { if (on) call.listen(); else call.unlisten(); }
  refresh();
  syncLock();
}

async function open() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const audio = new AudioContext();
  await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], {type: "text/javascript"})));
  const tap = new AudioWorkletNode(audio, "tap");
  const mute = audio.createGain();
  mute.gain.value = 0;
  // Connected through to the output, silent, so the browser keeps pulling the microphone through the tap.
  audio.createMediaStreamSource(stream).connect(tap).connect(mute).connect(audio.destination);
  // A microphone taken away (unplugged, or by another app) sends nothing again: no call made over it would be heard.
  stream.getAudioTracks().forEach((track) => { track.onended = () => end("The microphone was taken away. Press Connect to open it again."); });
  return {stream, audio, tap};
}

async function connect(claim) {
  talk.disabled = true;
  if (!media) media = await open();
  const {audio, tap} = media;
  // A page brought back from the background may find its microphone asleep: a call over it would send nothing.
  await audio.resume();
  const pc = new RTCPeerConnection();
  pc.addTransceiver("audio", {direction: "recvonly"});
  pc.ontrack = (event) => { out.srcObject = new MediaStream([event.track]); out.play(); };
  const channel = pc.createDataChannel("talk", {ordered: true});
  channel.binaryType = "arraybuffer";
  // Twenty milliseconds of the microphone a message.
  const per = Math.round(audio.sampleRate / 50);
  let pending = [], count = 0, marked = null;
  // No sample leaves the phone outside a turn. Inside one, what is gathered goes as audio; outside one, only how many
  // samples were gathered goes, as a `quiet`, which hands hears as that much silence: a message every 20 ms either way is
  // what hands' clock and its watch on this call run on (hands.voice.phone). The turn's edges end the message being
  // gathered, in the order the button's messages go out, so no sample of one side rides in a message of the other.
  const tag = ++tags;
  tap.port.onmessage = ({data}) => {
    if (typeof data === "number") { if (data === tag) { flush(); marked(); } return; }
    // The detector hears the microphone for as long as it is on, turns included, so the word said as a turn ends is heard.
    if (made.listening?.ready) made.listening.started.feed(data);
    if (made.turn.kind === "waiting") made.ring?.push(data);
    pending.push(data); count += data.length;
    if (count >= per) flush();
  };
  function flush() {
    if (count && channel.readyState === "open") channel.send(made.turn.kind === "waiting" ? JSON.stringify({kind: "quiet", samples: count}) : pcm(pending));
    pending = []; count = 0;
  }
  function tell(message) { if (channel.readyState === "open") channel.send(JSON.stringify(message)); }
  // Each edge of a turn goes out after the one before it has: a press made while a release still waits on its mark is sent
  // after that release, so hands hears them in the order the button made them, and one mark is out at a time.
  let sent = Promise.resolve();
  // The edges made and not yet gone out: a word the detector hears while one is on its way opens nothing, as one heard in a
  // turn opens nothing, so the wake and the button number their presses in the order hands hears them.
  let edges = 0;
  // An edge of a turn waits for the mark to come back through the tap, so every block the tap had when the turn moved has
  // been gathered, and it is flushed as the side of the edge it was gathered on: a count before a press, audio before a
  // release or before hands' word that a wake's turn is over. Then `act` moves the turn.
  const edge = (act) => { edges += 1; sent = sent.then(() => new Promise((done) => {
    marked = () => { try { act(); } finally { edges -= 1; done(); } };
    tap.port.postMessage(tag);
  })); };
  // The turn closes: the ring is emptied, so it holds only what the microphone made after it, as the Mac's clip owner clears
  // what it kept as a clip ends.
  const waiting = () => { made.turn = {kind: "waiting"}; made.ring?.empty(); };
  // The word the detector heard, at `score`, while no turn was open: the second kept before it, the wake, then the microphone
  // as it comes. What was gathered since the last message is in the ring, so it goes ahead of the wake and is not counted.
  function heardWord(score) {
    if (made.turn.kind !== "waiting" || edges > 0 || channel.readyState !== "open") return;
    for (const kept of cut(made.ring.empty(), per)) channel.send(kept);
    pending = []; count = 0;
    tell({kind: "wake", score});
    // A wake is a press hands numbers, in the order it hears them.
    const press = ++made.presses;
    made.turn = {kind: "wake", press, clip: null};
    show({press, number: null, milestone: "woken", at: null, released: null, heard: null, wake: true});
  }
  // The detector of this call, from when it is started: it fails, or is ready, or is turned off, each once. A message of one
  // that is no longer the call's is of a detector turned off, or of a call over.
  async function listen() {
    const listening = made.listening = {started: null, ready: false, why: null, waiting: null};
    try {
      const {startDetector} = await import("/detector.js");
      if (made.listening !== listening) return;
      listening.started = startDetector({
        rate: audio.sampleRate,
        onReady: (word) => ready(listening, word),
        onFailed: (why) => failed(listening, why),
        onHeard: (score) => { if (made.listening === listening) heardWord(score); },
        onWaiting: (why) => { if (made.listening === listening) { listening.waiting = why; drawNote(); } },
      });
    } catch (error) {
      failed(listening, `its script could not be loaded: ${error.message}`);
    }
  }
  function ready(listening, word) {
    if (made.listening !== listening) return;
    listening.ready = true; listening.waiting = null;
    phrase = word.phrase;
    made.ring = new Ring(Math.round(word.keptSeconds * audio.sampleRate));
    tell({kind: "detector", loaded: true, browser: BROWSER});
    tell({kind: "level", level: "wake word"});
    refresh();
  }
  function failed(listening, why) {
    if (made.listening !== listening) return;
    const wasReady = listening.ready;
    listening.started?.stop();
    listening.started = null; listening.ready = false; listening.waiting = null; listening.why = why;
    made.ring = null;
    tell({kind: "detector", loaded: false, browser: BROWSER, why});
    // hands holds the level the page last told it for as long as the call lasts.
    if (wasReady) tell({kind: "level", level: "off"});
    refresh();
  }
  function unlisten() {
    const listening = made.listening;
    if (listening === null) return;
    made.listening = null;
    listening.started?.stop();
    made.ring = null;
    if (listening.ready) tell({kind: "level", level: "off"});
    refresh();
  }
  // Each press is numbered in the call, as hands numbers the presses it hears over the ordered channel.
  const made = call = {pc, channel, ended: false, presses: 0,
    // What the microphone is going to: `waiting` for a turn, the wake's turn, or the button's.
    turn: {kind: "waiting"},
    // The last second of the microphone made while waiting, once the detector has said how long that is.
    ring: null,
    listening: null,
    listen, unlisten,
    press() { edge(() => { channel.send("press"); made.turn = {kind: "button"}; }); return ++this.presses; },
    release() { edge(() => { channel.send("release"); waiting(); }); },
    // The wake's turn is over on hands' word, unless a press has taken it over in the meantime.
    close() { const turn = this.turn; edge(() => { if (made.turn === turn) waiting(); }); },
  };
  channel.onopen = () => {
    wanted = true; tries = 0;
    talk.disabled = false; talk.textContent = "Hold to talk"; sayIdle();
    watch(made);
    syncLock();
    if (wakeOn) made.listen();
  };
  channel.onmessage = ({data}) => told(made, JSON.parse(data));
  channel.onclose = () => dropped(made, "hands hung up.");
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed") dropped(made, "The connection to hands failed."); };

  // From here on, what fails is this call, settled against it: never another call made since, as this one ended.
  try {
    await pc.setLocalDescription(await pc.createOffer());
    // Every candidate is gathered before the offer goes: hands answers once, with all of its own.
    await new Promise((done) => {
      if (pc.iceGatheringState === "complete") return done();
      pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && done());
    });
    const outcome = await asked("POST", "/offer", {sdp: pc.localDescription.sdp, type: "offer", rate: audio.sampleRate, page: PAGE, claim}, OFFER_MS);
    if (made.ended) return;
    // hands declines a call made again while another page has the phone: that page is the one in the user's hand. A
    // server error may pass, as hands is restarted; a refusal of the page's key or its offer never does.
    switch (outcome.kind) {
      case "answered": await pc.setRemoteDescription(outcome.body); break;
      case "refused":
        if (outcome.status === 409) end("Another page has hands' phone. Press Connect to take it here.");
        else if (outcome.status >= 500) dropped(made, `hands could not answer: ${outcome.text}.`);
        else end(`Could not connect: ${outcome.text}`);
        break;
      case "lost": dropped(made, `Could not reach hands: ${outcome.why}.`); break;
    }
  } catch (error) {
    dropped(made, `Could not reach hands: ${error.message}.`);
  }
}

// A call is gone once hands has sent nothing over it for QUIET_MS: a page woken from sleep finds its call still
// "connected", hands having hung it up while the phone could not hear it say so.
async function watch(made) {
  let received = null, heard = performance.now();
  while (!made.ended) {
    await new Promise((done) => setTimeout(done, 1000));
    if (made.ended) return;
    let now = 0, stats;
    // Closed while the wait ran: the call is over, and so is its watch.
    try { stats = await made.pc.getStats(); } catch { return; }
    stats.forEach((report) => { if (report.type === "inbound-rtp" && report.kind === "audio") now = report.packetsReceived; });
    if (now !== received) { received = now; heard = performance.now(); }
    else if (performance.now() - heard > QUIET_MS) dropped(made, "hands went quiet.");
  }
}

// What a call that ended leaves behind: the microphone, kept for the next, and nothing else.
function hangUp() {
  clearTimeout(retry); retry = null;
  if (call) { call.ended = true; call.listening?.started?.stop(); call.channel.close(); call.pc.close(); call = null; }
  held = false;
  letGo();
  drawNote();
  syncLock();
  // The rest of what was playing never reaches this page.
  stop(bargedIn);
  talk.classList.remove("held");
}

// The call `made` dropped: made again, after a wait that doubles with every try, while the page means to be on one.
function dropped(made, why) {
  if (made !== call || made.ended) return;
  if (!wanted) { end(`Could not connect: ${why}`); return; }
  hangUp();
  const wait = Math.min(FIRST_RETRY_MS * 2 ** tries, LAST_RETRY_MS);
  tries += 1;
  talk.disabled = true; talk.textContent = "Reconnecting";
  say(`${why} Calling again in ${Math.round(wait / 1000)} s…`, true);
  retry = setTimeout(() => { retry = null; place("resume"); }, wait);
}

// The page is done calling until Connect is pressed again: the microphone let go, and why said.
function end(why) {
  wanted = false; tries = 0;
  hangUp();
  if (media) { media.stream.getTracks().forEach((t) => t.stop()); media.audio.close(); media = null; }
  talk.disabled = false; talk.textContent = "Connect";
  say(why, true);
}

function place(claim) {
  say(claim === "take" ? "Connecting…" : "Calling hands again…");
  // What fails here failed before there was a call to make again: the microphone could not be opened or woken.
  connect(claim).catch((error) => end(`Could not connect: ${error.message}`));
}

function down(event) {
  event.preventDefault();
  // A page whose address carries no key never takes the microphone for a call hands would refuse; whether a key it
  // carries is the phone's is hands' to say.
  if (!carriesKey) { say("Open this page from the address `hands phone` prints.", true); return; }
  if (!call && !retry) { place("take"); return; }
  if (!call || call.channel.readyState !== "open" || held) return;
  talk.setPointerCapture(event.pointerId);
  held = true;
  talk.classList.add("held");
  // A new clip takes the place of the one shown: what is shown from here is this clip's.
  show({press: call.press(), number: null, milestone: "held", at: null, released: null, heard: null});
}

function up() {
  if (!held) return;
  held = false;
  talk.classList.remove("held");
  if (clip?.milestone === "held") show({...clip, milestone: "sent", released: performance.now()});
  call.release();
}

// The transcript is hidden until asked for, and stays as this phone last left it.
function showTranscript(open) {
  transcript.hidden = !open;
  shown.setAttribute("aria-expanded", String(open));
  shown.textContent = open ? "Hide transcript" : "Show transcript";
  if (open) transcript.scrollTop = transcript.scrollHeight;
}
try { showTranscript(localStorage.getItem("transcript") === "shown"); } catch { showTranscript(false); }
shown.addEventListener("click", () => {
  showTranscript(transcript.hidden);
  try { localStorage.setItem("transcript", transcript.hidden ? "hidden" : "shown"); } catch { /* kept for this page only */ }
});

talk.addEventListener("pointerdown", down);
talk.addEventListener("pointerup", up);
talk.addEventListener("pointercancel", up);
talk.addEventListener("contextmenu", (event) => event.preventDefault());
// A page put away mid-press lets go of the button; brought back, a call that dropped while it was away is made again at
// once rather than after the wait.
document.addEventListener("visibilitychange", () => {
  syncLock();
  if (document.hidden) { up(); return; }
  if (retry) { clearTimeout(retry); retry = null; place("resume"); }
});
wakeButton.addEventListener("click", () => setWake(!wakeOn));
drawWake();
// One closed hangs up.
addEventListener("pagehide", () => end("This page hung up."));

// The brain's work as hands last said it, its calls timed by hands' clock; whether a Stop is still being answered; what
// the last Stop said, until SAID_MS have passed; and why the brain could not be read, until it is read again.
let work = {doing: "idle", calls: []};
let stopping = false;
let said = null;
let unread = null;

function sayOfBrain(text, bad = false) { brainSaid.textContent = text; brainSaid.classList.toggle("bad", bad); }

// The line that says what the brain is doing, and for how long: redrawn each second, as the time is.
function drawDoing() {
  const now = handsNow();
  const [first, ...rest] = work.calls;
  const [what, since] = work.doing !== "working" ? ["Idle", null]
    : first === undefined ? ["Thinking", work.since]
    : [rest.length ? `Running ${rest.length + 1} calls` : `Running ${first.tool}`, first.since];
  doing.textContent = what;
  if (since !== null) doing.append(Object.assign(document.createElement("span"), {className: "for", textContent: ` · ${Math.max(0, Math.round(now - since))} s`}));
}

// A call's input as a glance reads it: its values, each a line, as the call gave them.
function inputOf(call) {
  return "unreadable" in call ? `input could not be read: ${call.unreadable}`
    : Object.values(call.input).map((value) => typeof value === "string" ? value : JSON.stringify(value)).join("\n");
}

// [LAW:dataflow-not-control-flow] the whole section is drawn the same way whatever the brain is doing: its calls are
// whatever it is running, none at all while it is idle or thinking.
function drawBrain() {
  drawDoing();
  calls.replaceChildren(...work.calls.map((call) => {
    const item = document.createElement("li");
    item.append(
      Object.assign(document.createElement("p"), {className: "tool", textContent: call.tool}),
      Object.assign(document.createElement("p"), {className: `input${"unreadable" in call ? " bad" : ""}`, textContent: inputOf(call)}),
    );
    return item;
  }));
  stopButton.disabled = stopping || work.doing !== "working";
  const told = said ?? unread ?? {text: "", bad: false};
  sayOfBrain(told.text, told.bad);
}

// Stop ends the turn the page shows, and that turn alone: one the brain went on to after it is never stopped by it.
stopButton.addEventListener("click", async () => {
  stopping = true;
  drawBrain();
  try {
    const outcome = await asked("POST", "/brain/stop", {turn: work.turn}, STOP_MS);
    sayOfStop(outcome.kind === "answered" ? {text: outcome.body.readback, bad: false} : {text: `Could not stop it: ${unanswered(outcome)}`, bad: true});
  } catch (error) {
    sayOfStop({text: `Could not stop it: ${error.message}`, bad: true});
  } finally {
    stopping = false;
    drawBrain();
  }
});

// What a Stop said, taken away SAID_MS later unless a later Stop has said something since.
function sayOfStop(stopSaid) {
  said = stopSaid;
  setTimeout(() => { if (said === stopSaid) { said = null; drawBrain(); } }, SAID_MS);
}

drawBrain();
setInterval(drawDoing, 1000);
// The brain is read for as long as the page is open.
reading("/brain", shown => {
  work = shown;
  unread = null;
  drawBrain();
}, why => { unread = {text: `Could not read the brain: ${why}`, bad: true}; drawBrain(); });
</script>
</body>
</html>
