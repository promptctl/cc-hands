<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>hands</title>
<style>
  :root {
    --bg: #f4f2ee; --fg: #1d1c1a; --muted: #6b6862; --ring: #d9d5cd;
    --idle: #2f2d2a; --live: #c2410c; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --fg: #eeebe6; --muted: #9a958d; --ring: #2c2a27; --idle: #e9e5de; --live: #f97316; --bad: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  /* "A little sticky": a scroll that ends near the top of the Call view goes back to it, and past it the scroll is free. The
     browser's own snap does it, with its own physics. */
  html { height: 100%; scroll-snap-type: y proximity; }
  body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #top { position: absolute; top: 0; left: 0; width: 1px; height: 1px; scroll-snap-align: start; }
  /* What passes under the bar does not show through the inset above it. */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--bg); z-index: 2; }
  /* The Call view scrolls the document, which is where the hero sticks and the button melts. Every other view is its own scroll
     container, the room the bar and the row leave it, and the document does not scroll under it. */
  body:has(#call-view[hidden]) { height: 100dvh; }
  body:has(#call-view[hidden]) #view { flex: 1; min-height: 0; overflow-y: auto; }
  /* The call: one block that is the big round button on the Call view at the top of its scroll and a bar across the top of the
     screen everywhere else. --melt is how far along it is, 0 the circle and 1 the bar, and every length the button has is a calc()
     of it: hero.js writes it, 1 as each view is shown and, on the Call view, from the scroll. Nothing here moves by a
     transition, so at any scroll position the button has the shape that position gives it. */
  #hero {
    --circle: min(68vw, 300px);
    --bar: 64px;
    --wake-band: 40px;
    --w: calc(var(--circle) + (62vw - var(--circle)) * var(--melt));
    --h: calc(var(--circle) + (var(--bar) - var(--circle)) * var(--melt));
    position: sticky; top: env(safe-area-inset-top); z-index: 1; align-self: stretch; margin-inline: -16px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: calc(8px + var(--wake-band) * (1 - var(--melt))) 8px 8px;
    /* The bar is the opaque part: what scrolls under it is hidden, and nothing under the rest of the hero's room is. */
    background: linear-gradient(var(--bg), var(--bg)) top / 100% calc(var(--h) + 16px + var(--wake-band) * (1 - var(--melt))) no-repeat;
    pointer-events: none;
  }
  #hero > * { pointer-events: auto; }
  /* The room the circle and its lines take is the Call view's from top to bottom of the melt, so the document is as long at
     the bar as at the circle: a hero that shrank as it melted would shorten the document under the scroll that drives it. The
     lines are three, the state line wrapping to two, and a hero with more is as tall as they make it while it is the circle. */
  body:has(#call-view:not([hidden])) #hero { min-height: calc(var(--circle) + var(--wake-band) + 44px + 4.2em); }
  /* Hidden until app.js has mounted the view that draws it: the circle on Call, the bar on the rest, and never the one of them for a frame before the other. */
  #hero:not([data-ready]) { visibility: hidden; }
  #hero.bar { flex-direction: row; }
  #talk {
    flex: none; width: var(--w); height: var(--h); margin-left: calc((100% - var(--w)) / 2 * (1 - var(--melt)));
    border-radius: calc(var(--h) / 2); border: calc(10px - 6px * var(--melt)) solid var(--ring); background: var(--idle); color: var(--bg);
    font: inherit; font-weight: 600; font-size: calc(22px - 5px * var(--melt)); line-height: 1.2; letter-spacing: .02em;
    touch-action: none; cursor: pointer; transition: transform .08s, background .08s;
  }
  #talk:disabled { opacity: .35; cursor: default; }
  #talk.held { background: var(--live); transform: scale(.96); }
  /* The two lines fade out under the button as it melts to half way, and fade in beside it from there, so the one change of
     layout between them is made while they cannot be seen. Reduced motion sets --melt to 0 or 1 alone, and they are not faded. */
  #told { color: var(--muted); text-align: center; align-self: center; max-width: 30ch; margin-top: 20px; opacity: calc(1 - 2 * var(--melt)); }
  #hero.bar #told {
    flex: 1; min-width: 0; align-self: auto; max-width: none; margin: 0; height: var(--bar); display: flex; flex-direction: column; justify-content: center;
    text-align: left; font-size: 13px; line-height: 1.3; opacity: calc(2 * var(--melt) - 1);
  }
  #told p { margin: 0; min-height: 1.4em; }
  #hero.bar #told p { min-height: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #state.bad, #wake-note.bad { color: var(--bad); }
  #count { font-variant-numeric: tabular-nums; }
  /* One small toggle in the corner of the circle, at the end of the bar's row: the dot is filled while the wake word is on, and its
     words are said to a screen reader alone once the bar has no room for them. */
  #wake {
    position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--ring); border-radius: 999px;
    padding: 4px 10px; cursor: pointer;
  }
  #wake .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
  #wake[aria-pressed="true"] .dot { background: var(--live); border-color: var(--live); }
  #hero.bar #wake { position: static; flex: none; align-self: center; width: 36px; height: 36px; padding: 0; justify-content: center; }
  #hero.bar #wake .words { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #wake-note:empty { display: none; }
  #shown { font: inherit; color: var(--muted); background: none; border: 1px solid var(--ring); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  #view, #call-view { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; }
  #call-view[hidden] { display: none; }
  /* The row is the router's from the moment it is on screen: hidden, in its place, until app.js has wired it. */
  #views:not([data-ready]) { visibility: hidden; }
  #views { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 2px; font-size: 15px; }
  #views a { color: var(--muted); text-decoration: none; padding: 6px 9px; border: 1px solid transparent; border-radius: 999px; }
  #views a[aria-current="page"] { color: var(--fg); border-color: var(--ring); }
  #sessions-note { color: var(--muted); text-align: center; max-width: 30ch; margin: 0; }
  #transcript {
    width: min(100%, 36rem); max-height: 38vh; overflow-y: auto; margin: 0; padding: 0 4px;
    user-select: text; -webkit-user-select: text;
  }
  #transcript p { margin: 0 0 10px; }
  #transcript:empty::before { content: "Nothing said yet."; color: var(--muted); }
  #transcript .user { color: var(--muted); text-align: right; }
  /* hands' words not yet reached are faint; the one being said is marked; those cut off are struck through. */
  #transcript .ahead { opacity: .45; }
  #transcript .now { background: var(--ring); border-radius: 3px; }
  #transcript .unheard { opacity: .45; text-decoration: line-through; }
  #brain { width: min(100%, 36rem); border-top: 1px solid var(--ring); padding-top: 10px; }
  #brain-head { display: flex; align-items: center; justify-content: space-between; column-gap: 12px; }
  #doing { margin: 0; font-weight: 600; }
  #doing .for { color: var(--muted); font-weight: 400; }
  #calls { list-style: none; margin: 4px 0 0; padding: 0; }
  #calls li { margin: 6px 0 0; }
  #calls .tool { font-size: 15px; font-weight: 600; margin: 0; }
  /* An input runs as long as the call made it: three lines of it, so the Stop never scrolls away. */
  #calls .input { margin: 0; color: var(--muted); font: 13px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  #calls .input.bad, #brain-said.bad { color: var(--bad); }
  #stop { font: inherit; font-weight: 600; font-size: 16px; line-height: 1; color: var(--bg); background: var(--bad); border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  #stop:disabled { opacity: .45; cursor: default; }
  #brain-said { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
  #brain-said:empty { display: none; }
</style>
</head>
<body>
<!-- The Call view's one snap position, the top of the document. -->
<div id="top"></div>
<!-- The call, drawn on every view: the one button and what is said of it. The Call view melts it from the circle into a bar as it
     scrolls (views/call.js); on every other view it is the bar from the first frame. hero.js is the one that shapes it. -->
<header id="hero">
<button id="talk" type="button">Connect</button>
<!-- The count changes ten times a second, so it sits outside the live region: a screen reader says each line once. -->
<div id="told">
  <p id="state" role="status" aria-live="polite"></p>
  <p id="wake-note" role="status" aria-live="polite"></p>
  <p id="count" aria-hidden="true"></p>
</div>
<!-- Whether the wake word may open a turn: on unless the user turned it off, before Connect or after. -->
<button id="wake" type="button" aria-pressed="true"><span class="dot" aria-hidden="true"></span><span class="words">Phone wake word</span></button>
</header>
<!-- The row of views, drawn by hands (hands.voice.phonepage) and mounted by app.js: a view of the app in this document, a page not
     yet moved into it in a tab of its own, under the same key. A call goes on through a tap on any of them. -->
<nav id="views" aria-label="Views"><!--row--></nav>
<!-- The Call view: the call writes the transcript whether it is shown or not, so these are the document's, shown while the Call
     view is (views/call.js). -->
<div id="call-view" hidden>
<button id="shown" type="button" aria-controls="transcript" aria-expanded="false">Show transcript</button>
<!-- Every line is written here whether it is shown or not: showing it is only taking the hidden off. -->
<section id="transcript" aria-label="Transcript" hidden></section>
</div>
<main id="view"></main>
<!-- The brain's panel, drawn into the Call view as it mounts (views/call.js). -->
<template id="brain-panel">
<!-- What the brain is doing now, as hands hears it on the wire: idle, thinking, or the calls it is running, each with
     its input, and how long; and one Stop that ends the brain's turn, as Escape at its keyboard does. Nothing here
     reaches a working session. -->
<section id="brain" aria-label="The brain">
  <div id="brain-head"><p id="doing" role="status" aria-live="polite"></p><button id="stop" type="button" disabled>Stop</button></div>
  <ul id="calls"></ul>
  <p id="brain-said" role="status" aria-live="polite"></p>
</section>
</template>
<audio id="out" autoplay playsinline></audio>
<!-- The call is the document's own, and the router mounts the views under it. -->
<script type="module" src="/app.js"></script>
</body>
</html>
