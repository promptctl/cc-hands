# Every PR into master, and the merge queue's run of it, runs the unit layer in shards and the type checks, as jobs in parallel,
# and the check named `test` passes when they all did and the PR is not built on the line master was rewound away from on
# 2026-10-15. The run ends in 5 minutes: every job here has `timeout-minutes: 5`, as every job in .github/workflows does.
# The tests marked `outside` (the real speech models, the pinned Claude Code, fritter's Go tests, wake-training's suite) run in
# outside.yml, on a schedule: the suite is about 40 minutes of test time on a runner, and a Free plan runs 5 macOS jobs at
# once, shared by every PR, so what a PR waits on is what fits 5 minutes. Where a test runs is docs/testing.md's "CI's tiers".
# `test` is the one name that says whether a PR's checks passed: it is what a repository setting would require on the PR and
# then in master's merge queue, on the commit master will be with the PR merged; none does yet, so a red one blocks nothing
# GitHub enforces. release.yml publishes only commits on master.
name: test

on:
  pull_request:
    branches: [master]
  # The queue's run: two PRs each green on an older master cannot turn it red together.
  merge_group:
  # A cache a PR saves is that PR's alone; the runs on master save the ones every PR restores.
  push:
    branches: [master]

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # [LAW:one-source-of-truth] the shards are the matrix's list, and each takes its number out of the total (tests/shards.py
  # packs by tests/shard-costs.json): a shard added to the list is a shard of N+1, with nothing else to edit. A red shard
  # ends the run in minutes, so fail-fast stays on.
  unit:
    name: unit ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: macos-15
    # A hung test fails the check instead of holding it for GitHub's 6 hours. Five minutes is the target a run is held to, and
    # a job that goes past it is a shard too big for it: add one to the list below.
    timeout-minutes: 5
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version from the history's tags when `uv sync` installs the checkout.
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          fetches: false
      # [LAW:one-source-of-truth] what the unit layer runs is the Makefile's, under the OS's hold on anything outside the process.
      - name: make check-unit
        id: check
        run: make check-unit SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      # What each test cost, into this job's log, so a cancelled or failed run keeps its numbers: `gh run view --log` reads
      # them, and tests/shards.py reads them into tests/shard-costs.json. A log and nothing beyond it: a store that refused an
      # upload would fail a suite that passed. continue-on-error for the same reason: a report that cannot be read shows red on
      # its own step and does not gate the suite's verdict. --no-sync: the locked environment is already built, and a sync here
      # would be time the cancelled run does not have.
      - name: What each test cost
        if: always() && steps.check.outcome != 'skipped'
        continue-on-error: true
        run: uv run --no-sync python tests/costs.py .pytest_cache/check-unit-log.jsonl

  types:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          fetches: false
      - name: make check-types
        run: make check-types

  # The verdict of the jobs. On ubuntu: it needs a checkout and nothing else, and a macOS runner is the scarce kind (a Free plan
  # runs 5 at once). !cancelled(), not always(): a run a newer push cancelled is not one this job reports on.
  test:
    needs: [unit, types]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The rewound line is refused by ancestry, which a shallow history cannot answer.
          fetch-depth: 0
      # A step of the job the verdict is read from, as a job or workflow of its own could go red and the PR still merge. On a PR the
      # commit is master merged with the PR, so a PR whose branch is on the line is refused too.
      - name: Not built on the rewound line
        run: scripts/not-rewound.sh "$GITHUB_SHA"
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success || { echo "the jobs' results are $RESULTS, not all success" >&2; exit 1; }; done
