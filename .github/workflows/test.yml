# Every PR into master, and the merge queue, runs the unit layer in shards beside the type checks, and the check named `test`
# passes when they all did and the PR is not built on the line master was rewound away from on 2026-10-15. Every job ends inside
# 5 minutes, so a person waiting on a PR hears pass or fail that long after its jobs get runners. `test` says whether the unit
# layer and the types passed, and `outside` (outside.yml) speaks for the rest of the suite: `test` is what a repository setting
# would require on the PR and then in master's merge queue, on the commit master will be with the PR merged; none does yet, so a
# red one blocks nothing GitHub enforces. release.yml publishes only commits on master.
#
# Why the tests marked `outside` are not here, and why 5 jobs: docs/testing.md, "Where CI runs the suite".
name: test

on:
  pull_request:
    branches: [master]
  # The queue's run: two PRs each green on an older master cannot turn it red together.
  merge_group:
  # A cache a PR saves is that PR's alone; the runs on master save the ones every PR restores.
  push:
    branches: [master]

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # [LAW:one-source-of-truth] the list is the shard count: `strategy.job-total` is its length, and tests/test_workflows.py holds
  # it to the numbers 1 to N, since a number left out is a shard no job runs. What a shard holds is tests/shards.py's, from
  # tests/shard-costs.json, which a stale file only unbalances: the packed seconds each shard prints beside what it cost are the
  # check on it. fail-fast is off so that a red shard does not hide what the others found.
  unit:
    name: unit ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: macos-15
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version from the history's tags when `uv sync` installs the checkout.
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/testbed
      - name: make check-unit
        id: check
        run: make check-unit SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      # What each test cost, into this job's log, so a cancelled or failed run keeps its numbers: `gh run view --log` reads
      # them, and tests/shards.py makes the cost file from them. A log and nothing beyond it: a store that refused an upload
      # would fail a suite that passed. continue-on-error for the same reason: a report that cannot be read shows red on its
      # own step and does not gate the suite's verdict. --no-sync: the locked environment is already built.
      - name: What each test cost
        if: always() && steps.check.outcome != 'skipped'
        continue-on-error: true
        run: uv run --no-sync python tests/costs.py .pytest_cache/check-unit-log.jsonl
      # The digest of the test ids this shard collected (tests/shards.py), for the verdict to hold the shards to one.
      - uses: actions/upload-artifact@v4
        with:
          name: collected-${{ matrix.shard }}
          path: .pytest_cache/v/shards/collected
          include-hidden-files: true
          if-no-files-found: error

  types:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
      - name: make check-types
        run: make check-types

  # The verdict of the jobs above. On ubuntu: it needs a checkout and nothing else, and a macOS runner is the scarce kind.
  # !cancelled(), not always(): a run a newer push cancelled is not one this job reports on.
  test:
    needs: [unit, types]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The rewound line is refused by ancestry, which a shallow history cannot answer.
          fetch-depth: 0
      # A step of the job the verdict is read from, as a job or workflow of its own could go red and the PR still merge. On a PR the
      # commit is master merged with the PR, so a PR whose branch is on the line is refused too.
      - name: Not built on the rewound line
        run: scripts/not-rewound.sh "$GITHUB_SHA"
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) is \(.value.result), not success"' <<< "$NEEDS")
          test -z "$failed" || { echo "$failed" >&2; exit 1; }
      # [LAW:single-enforcer] a test is in exactly one shard when every shard collected the same ids: one digest among them all.
      - uses: actions/download-artifact@v4
        with:
          pattern: collected-*
          path: collected
      - name: Every shard collected the same tests
        run: |
          digests=$(grep -H . collected/*/collected)
          test "$(cut -d: -f2- <<< "$digests" | sort -u | wc -l)" -eq 1 || { echo "the unit shards collected different tests, so one may run in none:" >&2; echo "$digests" >&2; exit 1; }
