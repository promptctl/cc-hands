# Every PR into master runs `make check` on the macOS a release builds on, and is refused if it is built on the line
# master was rewound away from on 2026-10-15. The check named `test` is required twice: on the PR, then in master's
# merge queue on the commit master will be with the PR merged. A red one cannot merge, and release.yml publishes only
# commits on master, so this is its gate.
name: test

on:
  pull_request:
    branches: [master]
  # The queue's run: two PRs each green on an older master cannot turn it red together.
  merge_group:
  # A cache a PR saves is that PR's alone; the runs on master save the ones every PR restores.
  push:
    branches: [master]

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    # The suite takes ~4 minutes here; a hung test fails the check instead of holding it for GitHub's 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads the version from the history's tags when `uv sync` installs the checkout, and the rewound
          # line is refused by ancestry, which a shallow history cannot answer.
          fetch-depth: 0
      # Only this job is required on master, so the refusal is a step of it: a job or workflow of its own would go red
      # and the PR would merge anyway. On a PR the commit is master merged with the PR, so a PR whose branch is on the
      # line is refused too.
      - name: Not built on the rewound line
        run: scripts/not-rewound.sh "$GITHUB_SHA"
      - uses: ./.github/actions/setup
      # The run fetches openWakeWord's models into pytest's cache before its first test; kept across runs, a download outage
      # cannot fail a PR that never touched the wake word.
      - uses: actions/cache@v4
        with:
          path: .pytest_cache/d/wake-word
          key: wake-word-${{ hashFiles('src/hands/voice/wake.py') }}
      # NLTK's punkt_tab, the sentence tokenizer pipecat splits a reply with, fetched by the run into pytest's cache at the
      # pin tests/sentences.py holds; kept the same way, for the same reason.
      - uses: actions/cache@v4
        with:
          path: .pytest_cache/d/nltk-data
          key: nltk-data-${{ hashFiles('tests/sentences.py') }}
      # The streaming tests run Nemotron Speech Streaming paired with Nemotron 3 Diarization, the engaged tests run
      # Smart Turn on MLX, and the voiceprint tests run ERes2Net, on real sound, fetched into the Hugging Face cache at the
      # revisions streaming.py, engaged.py and voiceprints.py pin; kept the same way, for the same reason. The whole hub:
      # a model's directory holds only links into the hub's shared store of blobs, where its weights are. Keyed on the
      # revisions, the one thing the weights depend on, so an edit to the rest of any of the files still finds them.
      - name: The speech models' pinned revisions
        id: speech
        run: |
          revisions=""
          for pin in streaming.py:REVISION streaming.py:DIARIZATION_REVISION engaged.py:SMART_TURN_REVISION voiceprints.py:REVISION; do
            file=${pin%%:*} name=${pin#*:}
            revision=$(sed -n "s/^$name = \"\([0-9a-f]*\)\"$/\1/p" "src/hands/voice/$file")
            test -n "$revision" || { echo "$file pins no $name this step can read" >&2; exit 1; }
            revisions="$revisions-$revision"
          done
          echo "revisions=$revisions" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: speech${{ steps.speech.outputs.revisions }}
      # The brain's end-to-end tests run the pinned Claude Code, fetched from npm's registry into pytest's cache against its
      # checksum, and the mock of Anthropic's API at the release they name, installed with go; kept the same way, keyed on the
      # pin and on the release.
      - name: The brain's pinned Claude Code and the mock's release
        id: e2e
        run: |
          claude=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' src/hands/brain/pinned.py)
          mock=$(sed -n 's/^MOCK_RELEASE = "\(.*\)"$/\1/p' tests/fetches.py)
          test -n "$claude" || { echo "src/hands/brain/pinned.py pins no VERSION this step can read" >&2; exit 1; }
          test -n "$mock" || { echo "tests/fetches.py names no MOCK_RELEASE this step can read" >&2; exit 1; }
          echo "claude=$claude" >> "$GITHUB_OUTPUT"
          echo "mock=$mock" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .pytest_cache/d/claude-code
          key: claude-code-${{ steps.e2e.outputs.claude }}
      - uses: actions/cache@v4
        with:
          path: .pytest_cache/d/mock-anthropic
          key: mock-anthropic-${{ steps.e2e.outputs.mock }}
      # [LAW:one-source-of-truth] the versions the suite runs on are uv.lock's; a lock out of step with pyproject fails here.
      - name: Install the locked environment
        run: uv sync --locked
      # The backlog tests that run lit itself skip without one; the release its own installer hands out is what hands
      # meets, so a lit release that changes what hands reads fails here, not days later in every brain's audit log.
      # gh names that release under the job's token, and the installer comes from the same tag as the archive it
      # installs: the installer's own --latest-release asks api.github.com
      # unauthenticated, which answers a runner's shared address with a 403 once the hour's quota is spent.
      # [LAW:no-silent-failure] the installer runs from a file: piped into bash, a failed download is an empty script
      # that exits 0, and the suite then skips every lit test without a word.
      - name: Install lit
        env:
          GOBIN: ${{ runner.temp }}/lit
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo promptctl/links-issue-tracker --json tagName --jq .tagName)"
          curl -fsSL -o "$RUNNER_TEMP/lit-install.sh" https://raw.githubusercontent.com/promptctl/links-issue-tracker/$tag/scripts/install.sh
          bash "$RUNNER_TEMP/lit-install.sh" --from-release "$tag"
          # The lit tests skip without a lit on PATH: a lit put anywhere but where the next step looks fails here.
          "$GOBIN/lit" version
          echo "$GOBIN" >> "$GITHUB_PATH"
      # A Claude Code policy in its folder and its plists, as a developer's Mac or a managed one has: the run's sandbox must
      # keep it from every Claude Code the run starts (tests/offline.sb), and the run stops before any test if it finds it.
      # [LAW:verifiable-goals] WebFetch allowed, a Claude Code that applied this policy would fetch without asking, and the
      # e2e's WebFetch dialog tests would wait for a dialog that never comes (docs/claude-code-behavior.md, machine policy allow).
      - name: A machine's Claude Code policy
        run: |
          policy='{"permissions": {"allow": ["WebFetch"]}}'
          settings="/Library/Application Support/ClaudeCode/managed-settings.d"
          preferences="/Library/Managed Preferences"
          sudo mkdir -p "$settings" "$preferences/$USER"
          echo "$policy" | sudo tee "$settings/10-machine.json"
          for plists in "$preferences" "$preferences/$USER"; do
            echo "$policy" | sudo plutil -convert xml1 -o "$plists/com.anthropic.claudecode.plist" -
          done
      # [LAW:one-source-of-truth] the suite is the Makefile's check.
      - name: make check
        run: make check
