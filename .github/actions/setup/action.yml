# [LAW:one-source-of-truth] the environment test.yml gates on and release.yml builds in: Go for fritter, uv on the
# Python floor requires-python names, Homebrew's PortAudio, which PyAudio builds against on a Mac, and Bun, which runs the
# mock of Anthropic's API the brain's end-to-end tests run against.
name: setup
description: Go, uv on Python 3.12, PortAudio, and Bun, for a checkout that has its history and tags
runs:
  using: composite
  steps:
    # hatch_build.py builds fritter with Go when the checkout is installed or built.
    - uses: actions/setup-go@v5
      with:
        go-version-file: fritter/go.mod
        cache-dependency-path: fritter/go.sum
    # Without a pin uv takes the newest Python on the runner; 3.12 is the oldest hands supports.
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    # PyAudio ships wheels only for Windows, so on a Mac it builds against Homebrew's PortAudio.
    - name: PortAudio
      shell: bash
      run: brew install portaudio
    # tests/test_brain_e2e.py runs promptctl/mock-anthropic, which is TypeScript run by Bun.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"
